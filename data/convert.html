<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>MTG Oracle Data Converter</title>
	<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
</head>
<body>
	<div id="content">
		<label for="oracle-file">Select the Oracle cards JSONL file:</label>
		<input id="oracle-file" type="file" accept=".jsonl,.ndjson">
		<button id="master-data" style="display: none;">Data</button>
		<a id="data" style="display: none;">Click to download</a>
	</div>

	<script>
		(function($) {
			const MTG = {
				saveFile: null,
				cards: [],
			};

			MTG.loadMasterData = async function(file) {
				this.cards = [];
				const text = await file.text();
				const today = new Date();
				const year = today.getFullYear();
				const month = String(today.getMonth() + 1).padStart(2, '0');
				const day = String(today.getDate()).padStart(2, '0');
				const currentDate = `${year}-${month}-${day}`;

				for (const line of text.split(/\r?\n/)) {
					if (line.trim() === '') {
						continue;
					}
					const oracleCard = JSON.parse(line);

					if (
						oracleCard.legalities.commander === 'legal' ||
						oracleCard.legalities.oathbreaker === 'legal' ||
						oracleCard.set_type === 'token' ||
						oracleCard.released_at >= currentDate
					) {
						let card = {
							oracle_id: oracleCard.oracle_id,
							name: oracleCard.name,
							type_line: oracleCard.type_line,
							cmc: parseInt(oracleCard.cmc),
							colors: oracleCard.colors,
							mana_cost: typeof oracleCard.mana_cost === 'string' && oracleCard.mana_cost !== ''
								? oracleCard.mana_cost
								: (oracleCard.card_faces || [])
									.map(face => face.mana_cost)
									.filter(cost => typeof cost === 'string' && cost !== '')
									.join(' // '),
							layout: oracleCard.layout,
							rarity:oracleCard.rarity,
							commander: oracleCard.legalities.commander === 'legal',
							oathbreaker: oracleCard.legalities.oathbreaker === 'legal',
							images: {
								front: {
									small: 'assets/back.jpeg',
									normal: 'assets/back.jpeg',
								},
								back: {
									small: 'assets/back.jpeg',
									normal: 'assets/back.jpeg',
								},
							},
						};

						if (Object.hasOwnProperty.call(oracleCard, 'image_uris')) {
							card.images.front.small = oracleCard.image_uris.small;
							card.images.front.normal = oracleCard.image_uris.normal;
						}

						if (Object.hasOwnProperty.call(oracleCard, 'card_faces')) {
							if (Object.hasOwnProperty.call(oracleCard.card_faces[0], 'image_uris')) {
								card.images.front.small = oracleCard.card_faces[0].image_uris.small;
								card.images.front.normal = oracleCard.card_faces[0].image_uris.normal;
							}

							if (Object.hasOwnProperty.call(oracleCard.card_faces[1], 'image_uris')) {
								card.images.back.small = oracleCard.card_faces[1].image_uris.small;
								card.images.back.normal = oracleCard.card_faces[1].image_uris.normal;
							}
						}

						this.cards.push(card);
					}
				}

				this.cards.sort(function(a, b) {
					if (a.name > b.name) {
						return 1;
					}

					if (a.name < b.name) {
						return -1;
					}

					return 0;
				});
			};

			MTG.createNameIndexes = function() {
				const nameIndex = new Map();
				const searchIndex = new Map();
				const isToken = card => /\bToken\b/.test(card.type_line.split('\u2014')[0]);
				for (let cardIndex = 0; cardIndex < this.cards.length; cardIndex++) {
					const card = this.cards[cardIndex];
					const name = card.name.toLowerCase();
					const existingIndex = nameIndex.get(name);
					if (existingIndex === undefined ||
						(!isToken(card) && isToken(this.cards[existingIndex]))) {
						nameIndex.set(name, cardIndex);
					}

					const cardTrigrams = new Set();
					for (let i = 0; i <= name.length - 3; i++) {
						cardTrigrams.add(name.slice(i, i + 3));
					}
					for (const trigram of cardTrigrams) {
						if (!searchIndex.has(trigram)) {
							searchIndex.set(trigram, []);
						}
						searchIndex.get(trigram).push(cardIndex);
					}
				}
				return { nameIndex, searchIndex };
			};

			MTG.createDownload = function() {
				let $fileLink = $('#data');
				$fileLink.hide();
				const { nameIndex, searchIndex } = this.createNameIndexes();

				let blob = new Blob(
					[
						'const masterData = ' + JSON.stringify(this.cards, null, 2) + ';\n' +
						'const masterDataNameIndex = new Map(' + JSON.stringify([...nameIndex]) + ');\n' +
						'const masterDataSearchIndex = new Map(' + JSON.stringify([...searchIndex]) + ');\n'
					],
					{
						type: 'text/javascript'
					}
				);

				if (this.saveFile !== null) {
					window.URL.revokeObjectURL(this.saveFile);
				}
				this.saveFile = window.URL.createObjectURL(blob);

				$fileLink.text('master-data.js');
				$fileLink.attr({
					download: 'master-data.js',
					href : this.saveFile
				});
				$fileLink.show();
			};

			$(document).ready(function() {
				$('#oracle-file').on('change', async function() {
					const file = this.files[0];
					if (!file) {
						return;
					}

					this.disabled = true;
					$('#data').hide();
					try {
						await MTG.loadMasterData(file);
						MTG.createDownload();
					} catch (error) {
						console.error(error);
						alert('Could not load or convert the card data: ' + error.message);
					} finally {
						this.disabled = false;
						this.value = '';
					}
				});
			});
		})(jQuery);
	</script>
</body>
</html>
